<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="refresh" content="0" />
    <title>Mustafa Gocmen</title>
    <script>
      // GitHub Pages has no server-side rewrites, so a direct load of e.g.
      // /projects 404s. This stashes the real path and redirects to the
      // root SPA, which restores it via history.replaceState (see index.html).
      sessionStorage.setItem("spa-redirect", location.pathname + location.search + location.hash);
      location.replace("/");
    </script>
  </head>
  <body></body>
</html>
