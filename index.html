    />

  <body>
    <script>
      // Companion to public/404.html — restores the real path after a
      // direct-load redirect bounced through the SPA fallback.
      (function () {
        var redirect = sessionStorage.getItem("spa-redirect");
        if (redirect) {
          sessionStorage.removeItem("spa-redirect");
          if (redirect !== location.pathname + location.search + location.hash) {
            history.replaceState(null, "", redirect);
          }
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
